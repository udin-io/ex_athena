# CI for ex_athena — see https://github.com/udin-io/ex_athena/issues/171.
#
# Two classes of check live in this file, and the split is deliberate. Every
# step below is named BLOCKING or ADVISORY; read the name, not the tick.
#
#   BLOCKING — a failure fails the build:
#     * mix compile --warnings-as-errors   (on Elixir 1.18; see the test job)
#     * mix test                           (whole matrix)
#     * mix format --check-formatted
#
#   ADVISORY — runs on every PR, prints its findings, never fails the build:
#     * mix compile --warnings-as-errors   (on Elixir 1.19 / 1.20)
#     * mix credo --strict
#     * mix dialyzer
#     * mix sobelow --config
#     * mix deps.audit
#     * mix hex.audit
#
# ADVISORY IS NOT THE SAME AS PASSING. Measured on this branch's first CI run
# (main was at 4caa611, 2026-09-02):
#
#     mix credo --strict   244 findings — 6 warning / 103 refactoring / 49 readability / 86 design, exit 30
#     mix dialyzer          41 warnings, exit 2
#     mix sobelow           69 findings — 2 Misc.BinToTerm + 1 Config.HTTPS at high confidence, 66 low
#     mix deps.audit         5 advisories across req / cowboy / cowlib, exit 1
#     mix hex.audit         27 advisories across 10 packages — 13 high, 10 medium, 4 low, exit 1
#
# credo and dialyxir had been declared in mix.exs for a long time and never run,
# so those backlogs accumulated unseen; the dependency advisories are real and
# want a version-bump PR of their own. Making any of these blocking here would
# mean either clearing ~350 findings and a dependency upgrade inside a CI
# ticket, or suppressing them. Both are wrong, so they run loudly instead.
#
# Nothing is suppressed to buy a green tick. There is no `# credo:disable-for-*`,
# no `@dialyzer {:nowarn_function, ...}`, no `.dialyzer_ignore.exs`, and no
# `# sobelow_skip` anywhere in the tree; `.sobelow-conf` carries `ignore: []`,
# `ignore_files: []` and `skip: false`; and `mix deps.audit` runs without
# `--ignore-advisory-ids`.
#
# Promoting an advisory check is a one-line change: delete its
# `continue-on-error: true`. Do that as each backlog reaches zero.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The matrix is the range mix.exs claims to support (`elixir: "~> 1.18"`).
    # 1.18/OTP 27 is the floor and the version the project is actually developed
    # against; the newer pairs stop the declared range from rotting silently.
    #
    # `mix test` is blocking on all three. `--warnings-as-errors` is blocking
    # only on 1.18, because 1.19 and 1.20 tightened the type checker and the
    # tree does not yet compile clean under them (struct-update inference in
    # ExAthena.Chat.Tui.View on 1.19; several more in ExAthena.Providers.
    # ClaudeCode and ExAthena.Web.Live.ChatLive on 1.20). Those warnings are
    # real and worth fixing — they are surfaced on every PR rather than either
    # ignored or allowed to block work on a version nobody develops against yet.
    name: test (elixir ${{ matrix.elixir }} / otp ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.5"
            otp: "27.3.4.17"
            strict_warnings: true
          - elixir: "1.19.6"
            otp: "28.5.0.6"
            strict_warnings: false
          - elixir: "1.20.4"
            otp: "28.5.0.6"
            strict_warnings: false
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # ExAthena.Sandbox shells out to `bwrap` on Linux (`sandbox-exec` on
      # macOS) and ExAthena.Tools.Bash fails closed when the helper is missing,
      # so the confinement tests need it present. Ubuntu 24.04 also gates
      # unprivileged user namespaces behind AppArmor, which bwrap requires —
      # relaxed here for the runner VM only.
      - name: Install bubblewrap (sandbox helper for the confinement tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get

      - name: Compile deps
        run: mix deps.compile

      # Deliberately the first compile of the project itself: a second
      # --warnings-as-errors pass over an already-compiled tree recompiles
      # nothing and so re-emits nothing, which would make this gate a no-op.
      - name: BLOCKING — mix compile --warnings-as-errors
        if: matrix.strict_warnings
        run: mix compile --warnings-as-errors

      - name: ADVISORY — mix compile --warnings-as-errors (elixir ${{ matrix.elixir }} type warnings, not yet fixed)
        if: ${{ !matrix.strict_warnings }}
        run: mix compile --warnings-as-errors
        continue-on-error: true

      - name: BLOCKING — mix test
        run: mix test

  format:
    # BLOCKING. Cheap, and green on main today, so there is no reason for it
    # not to be.
    name: format
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.17"
          elixir-version: "1.18.5"

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-deps-1.18.5-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-1.18.5-

      # .formatter.exs does `import_deps: [:phoenix, :phoenix_live_view]`, so
      # the dep sources have to be on disk — but they never need compiling.
      - run: mix deps.get

      - name: BLOCKING — mix format --check-formatted
        run: mix format --check-formatted

  security:
    # This library shells out to OS processes, drives an HTTP client, and ships
    # a web console, so dependency advisories and Phoenix-shaped findings matter
    # here. All three checks are advisory *today* only because all three are red
    # on main — see the header for the counts and the reasoning. Flip them to
    # blocking as each one is cleared.
    #
    # deps.audit (mix_audit, backed by the elixir-security-advisories repo) and
    # hex.audit (backed by Hex's own OSV feed) are both kept on purpose: they
    # disagree, and today hex.audit sees strictly more.
    name: security
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.17"
          elixir-version: "1.18.5"

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-27.3.4.17-1.18.5-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-27.3.4.17-1.18.5-

      - run: mix deps.get

      - name: ADVISORY — mix hex.audit (27 advisories across 10 packages; needs a dependency-bump PR)
        run: mix hex.audit
        continue-on-error: true

      - name: ADVISORY — mix deps.audit (5 advisories; needs a dependency-bump PR, not a suppression)
        run: mix deps.audit
        continue-on-error: true

      - name: ADVISORY — mix sobelow --config (69 findings today; tracked for burn-down)
        run: mix sobelow --config
        continue-on-error: true

  advisory:
    # ADVISORY — every check step here is `continue-on-error: true` on purpose.
    # Read the header of this file before reading a green tick here as "clean".
    name: static analysis (advisory)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.17"
          elixir-version: "1.18.5"

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-27.3.4.17-1.18.5-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-27.3.4.17-1.18.5-

      - run: mix deps.get

      - name: Compile
        run: mix compile

      - name: ADVISORY — mix credo --strict (244 findings today; tracked for burn-down)
        run: mix credo --strict
        continue-on-error: true

      # The PLT is the expensive half of dialyzer — minutes on a cold cache,
      # seconds on a warm one. Keyed on OTP + Elixir + mix.lock because a PLT
      # built against a different version of any of those is invalid. mix.exs
      # points dialyxir at ./plts so this cache can address it directly.
      - name: Cache dialyzer PLT
        uses: actions/cache@v6
        with:
          path: plts
          key: ${{ runner.os }}-plt-27.3.4.17-1.18.5-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-27.3.4.17-1.18.5-

      - name: Build dialyzer PLT
        run: mix dialyzer --plt

      - name: ADVISORY — mix dialyzer (41 warnings today; tracked for burn-down)
        run: mix dialyzer --format short
        continue-on-error: true
